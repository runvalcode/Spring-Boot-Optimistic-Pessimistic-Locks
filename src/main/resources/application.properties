spring.application.name=Spring-Boot-Optimistic-Pessimistic-Locks

# ============================================
# 🗄️ MYSQL DATABASE CONFIGURATION
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/practicals?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# 🧱 JPA / HIBERNATE — AUTO TABLE UPDATE
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ============================================
# 📝 LOGGING CONFIGURATION
# ============================================
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Optional: log to file
logging.file.name=logs/myapplication.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Run data.sql on every startup
spring.sql.init.mode=always

# ⚠️ IMPORTANT: do this so data.sql runs AFTER Hibernate creates the table
spring.jpa.defer-datasource-initialization=true